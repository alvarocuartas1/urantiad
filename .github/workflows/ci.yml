name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, alembic, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urantiad
          POSTGRES_PASSWORD: urantiad
          POSTGRES_DB: urantiad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urantiad -d urantiad_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://urantiad:urantiad@localhost:5432/urantiad_test
      TEST_DATABASE_URL: postgresql+psycopg://urantiad:urantiad@localhost:5432/urantiad_test
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  production-images:
    name: Production images (build, smoke test through Caddy)
    runs-on: ubuntu-latest
    env:
      # Throwaway values: this job only checks that the production stack builds and serves.
      DOMAIN: localhost
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      COMPOSE_FILE: docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --detach --build --wait
      - name: Smoke test
        run: |
          # Caddy issues a local certificate for "localhost": skip its verification.
          curl --fail --silent --show-error --insecure --retry 10 --retry-all-errors \
            --retry-delay 2 https://localhost/api/v1/health
          curl --fail --silent --insecure https://localhost/ventas | grep --quiet 'id="root"'
          curl --silent --insecure --head https://localhost/ \
            | grep --quiet --ignore-case '^content-security-policy:'
          # Only Caddy is published: the backend and the database are not reachable.
          ! curl --silent --max-time 3 http://localhost:8000/api/v1/health
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
